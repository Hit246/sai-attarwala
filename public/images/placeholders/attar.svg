<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#1a1813" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C649" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="376" height="376" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.4"/>
  <!-- Attar Bottle SVG Artwork -->
  <g transform="translate(100, 70)">
    <!-- Bottle Cap -->
    <path d="M75,20 L125,20 L120,45 L80,45 Z" fill="url(#goldGrad)" />
    <rect x="90" y="45" width="20" height="15" fill="#AA7C11" />
    <!-- Bottle Neck -->
    <path d="M80,60 L120,60 L130,85 L70,85 Z" fill="url(#goldGrad)" />
    <!-- Bottle Body -->
    <rect x="50" y="85" width="100" height="130" rx="15" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Inner Liquid/Ornamentation -->
    <rect x="60" y="105" width="80" height="90" rx="8" fill="url(#goldGrad)" opacity="0.15" />
    <circle cx="100" cy="145" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M100,130 L100,160 M85,145 L115,145" stroke="url(#goldGrad)" stroke-width="2" />
  </g>
  <text x="200" y="325" text-anchor="middle" fill="url(#goldGrad)" font-family="sans-serif" font-size="20" font-weight="600" letter-spacing="2">PURE ATTAR</text>
  <text x="200" y="350" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="14">Sai Attarwala Collection</text>
</svg>
